[workspace]
resolver = "2"
members = ["core", "ffi", "sidecar"]
# A relocated cargo home, used when the real `~/.cargo` is not writable. A build aid, not
# a member of this project.
exclude = [".cargo-home"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/MidSanCode/openField-SDK"
description = "OpenField community bot SDK: a Rust core with sidecar and C-ABI transports"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
